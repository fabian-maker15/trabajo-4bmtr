<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Datos</title>
    <!-- Aquí se vincula el archivo CSS -->
    <link rel="stylesheet" href="Untitled-1.css">
</head>
<body>
    <div class="container">
        <h1>Formulario de datos</h1>

        <label>Usuario</label>
        <input type="text" name="usuario"><br><br>

        <label>Nombres</label>
        <input type="text" name="nombres" id="nombres"><br><br>

        <label>Apellidos</label>
        <input type="text" name="apellidos" id="apellidos"><br><br>

        <label>Contraseña</label>
        <input type="password" name="contra"><br><br>

        <label>Correo electrónico</label>
        <input type="email" name="correo"><br><br>

        <label>Edad</label>
        <input type="number" name="edad"><br><br>

        <label>Edad oficial</label>
        <input type="number" name="edadoficial" min="18" max="65"><br><br>

        <label>Puntuación</label>
        <input type="number" name="puntuacion" min="5" max="50" step="5"><br><br>

        <label>Fecha de nacimiento</label>
        <input type="date" name="nacimiento"><br><br>

        <label>Hora de nacimiento</label>
        <input type="time" name="nacimiento"><br><br>

        <label>Color favorito</label>
        <input type="color" name="nacimiento"><br><br>

        <h2>¿Quién ganó el mundial de fútbol del 2014?</h2>
        <label><input type="radio" name="pais" value="Alemania"> Alemania</label><br>
        <label><input type="radio" name="pais" value="Bolivia"> Bolivia</label><br>
        <label><input type="radio" name="pais" value="Brasil"> Brasil</label><br>
        <label><input type="radio" name="pais" value="Francia"> Francia</label><br><br>

        <h2>¿Cuáles son películas de acción?</h2>
        <label><input type="checkbox" name="peliculas" value="juego"> Juego de tronos</label><br>
        <label><input type="checkbox" name="peliculas" value="rapidos"> Rápidos y furiosos</label><br>
        <label><input type="checkbox" name="peliculas" value="interestelar"> Interstelar</label><br>
        <label><input type="checkbox" name="peliculas" value="infierno"> El infierno verde</label><br>
        <label><input type="checkbox" name="peliculas" value="sentencia"> Sentencia de muerte</label><br><br>

        <label>Seleccione un archivo</label><br>
        <input type="file" name="archivo" accept=".xlsx"><br><br>

        <label>Seleccione un valor</label><br>
        <input type="range" name="archivo" min="0" max="100" value="50"><br><br>

        <button onclick="saludo()">Saludo</button>
        <p id="mensaje"></p>

        <label>Nota teórica</label>
        <input type="number" id="nota_teorica" min="0" max="30"><br><br>

        <label>Nota práctica</label>
        <input type="number" id="nota_practica" min="0" max="70"><br><br>

        <button onclick="calculo_nota()">Nota</button>
        <p id="nota_sumada"></p>
    </div>

    <script src="JStarea.js"></script>
</body>
</html>
